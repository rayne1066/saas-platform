name: Free secret guard

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: Audit all fetched history instead of the current tracked files
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: free-secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out history without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan credentials and private environment files
        run: python3 .secret-guard/guard.py ci
